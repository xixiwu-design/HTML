<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>IG如是说</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background-color: #1a1f5c; /* 深蓝色背景 */
            color: #fc0f0f; /* 主文字红色 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        /* 中心容器 */
        .center-container {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 大字体竖排文字 */
        .main-vertical {
            writing-mode: vertical-rl; /* 竖排 */
            font-size: 4em;
            font-weight: bold;
            margin: 0 40px;
        }

        /* 小字体竖排文字 */
        .side-vertical {
            writing-mode: vertical-rl; /* 竖排 */
            font-size: 1.5em;
            color: #6d2d2d; /* 更不起眼的红色 */
            margin: 0 10px;
        }

        /* 页脚 */
        footer {
            position: absolute;
            bottom: 20px;
            text-align: center;
            font-size: 1.2em;
            color: #ffffff;
            background: rgba(26, 31, 92, 0.9);
            padding: 10px 20px;
            border-radius: 5px;
        }

        /* 响应式适配 */
        @media (max-width: 768px) {
            .main-vertical { font-size: 3em; margin: 0 20px; }
            .side-vertical { font-size: 1em; margin: 0 5px; }
            footer { font-size: 1em; padding: 5px 10px; }
        }
    </style>
</head>
<body>
    <div class="center-container">
        <div class="main-vertical">别碰我老公皮鼓</div>
        <div class="side-vertical">除非是我碰的 受着。</div>
    </div>

    <footer>
        ——著名主播IG曾这样说过
    </footer>
</body>
</html>
